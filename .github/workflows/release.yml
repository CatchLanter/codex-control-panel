name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Bundle Node runtime for the terminal daemon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/node | Out-Null
          Copy-Item (Get-Command node).Source build/node/node.exe -Force

      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --repo ${{ github.repository }} `
            --title "${{ github.ref_name }}" `
            --notes "由 GitHub Actions 自动构建的 Windows 安装包。"
          gh release upload "${{ github.ref_name }}" `
            "release/*.exe" `
            --repo ${{ github.repository }} `
            --clobber
